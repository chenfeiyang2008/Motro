<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motro 周挑战榜原型</title><style>
:root{--b:#2f6fed;--bg:#f7f9fc;--s:#fff;--t:#182230;--m:#5d6b7a;--line:#dce3ec;--ok:#23875b;--warn:#c47a16;--bad:#c84545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 PingFang SC,Noto Sans SC,system-ui,sans-serif}button,input{font:inherit}button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--t);padding:10px 14px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #8db1ff;outline-offset:2px}.primary{border-color:var(--b);background:var(--b);color:#fff;font-weight:700}.shell{max-width:760px;margin:auto;padding:28px 16px 56px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.brand{font-weight:800;color:var(--b);letter-spacing:-.04em}.muted{color:var(--m)}h1{font-size:28px;line-height:1.28;margin:0 0 8px}.panel{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric strong{display:block;font-size:24px}.metric span{font-size:14px;color:var(--m)}.notice{border-left:3px solid var(--b);padding-left:12px;color:var(--m)}.rank{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.rank:first-child{border-top:0}.you{background:#eaf1ff;margin:0 -12px;padding:14px 12px;border-radius:8px}.quiz{max-width:640px;margin:auto}.q-meta{display:flex;justify-content:space-between;color:var(--m);font-size:14px}.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--t)}.prompt{font:500 clamp(34px,9vw,48px)/1.15 Lexend,system-ui,sans-serif;margin:42px 0 10px;overflow-wrap:anywhere}.source{font-size:14px;color:var(--m)}.score-status{display:inline-block;margin-top:22px;padding:4px 8px;border-radius:999px;background:#eaf1ff;color:#255ed0;font-size:14px}.options{display:grid;gap:10px;margin:32px 0}.option{text-align:left}.option[aria-pressed=true]{border-color:var(--b);background:#eaf1ff}.answer{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;padding:12px;margin:32px 0 12px}.feedback{border-radius:8px;padding:14px;margin:20px 0}.good{background:#edf8f2;color:#176445}.wrong{background:#fff2f2;color:#9e3030}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.actions .primary{margin-left:auto}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:1/-1}.shell{padding-top:20px}.top{align-items:flex-start}}
</style><body><main id="app" class="shell"></main><script>
const qs=[{w:'sustain',z:'维持',course:'高中英语必修一 · Unit 2',type:'choice',opts:['维持','减少','证明','观察'],score:true},{w:'evident',z:'明显的',course:'高中英语必修一 · Unit 2',type:'spell',score:true},{w:'convey',z:'传达；传递',course:'高中英语必修一 · Unit 2',type:'choice',opts:['传达；传递','比较','保护','选择'],score:true},{w:'shelter',z:'庇护所',course:'高中英语必修二 · Unit 1',type:'spell',score:true},{w:'abandon',z:'放弃',course:'高中英语必修一 · Unit 3',type:'choice',opts:['放弃','观察','修理','讨论'],score:false},{w:'retain',z:'保留',course:'高中英语必修二 · Unit 1',type:'spell',score:true},{w:'decline',z:'减少；下降',course:'高中英语必修一 · Unit 3',type:'choice',opts:['增加','减少；下降','改善','测量'],score:true},{w:'accurate',z:'准确的',course:'高中英语必修二 · Unit 2',type:'spell',score:false},{w:'emerge',z:'出现',course:'高中英语必修二 · Unit 2',type:'choice',opts:['出现','隐藏','改变','解释'],score:true},{w:'observe',z:'观察',course:'高中英语必修一 · Unit 2',type:'spell',score:false}];
let s={page:'board',i:0,selected:'',feedback:null,points:35,earned:0,correct:0,time:300};const app=document.querySelector('#app');
const head=()=>'<div class="top"><span class="brand">motro</span><span class="muted">临时交互原型 · 不保存数据</span></div>';
function board(){return head()+`<h1>周挑战榜</h1><p class="muted">本周挑战积分 · 北京时间周一 00:00 结算</p><section class="panel"><div class="metrics"><div class="metric"><strong>${s.points}</strong><span>我的挑战积分</span></div><div class="metric"><strong>18</strong><span>可得分词条方向</span></div><div class="metric"><strong>3 XP</strong><span>预计周奖励（上限 200）</span></div></div><p class="notice">日常学习 XP 不参与排名。本场 10 题，最多可得 35 分；速度不加分。</p><button class="primary" data-a="start">开始测验</button></section><section class="panel"><div class="rank"><strong>1</strong><span>林同学</span><strong>55</strong></div><div class="rank you"><strong>2</strong><span>陈同学（你）<small class="muted"> · 先达到 35 分</small></span><strong>${s.points}</strong></div><div class="rank"><strong>3</strong><span>周同学</span><strong>30</strong></div></section><p class="muted">可在“我的”设置退出公开榜；退出后仍可测验和获得个人奖励。</p>`}
function quiz(){let q=qs[s.i],choice=q.type==='choice';let body=choice?`<div class="options">${q.opts.map(x=>`<button class="option" aria-pressed="${s.selected===x}" data-choice="${x}">${x}</button>`).join('')}</div>`:`<label><span class="muted">输入英文拼写（忽略大小写和首尾空格）</span><input class="answer" id="answer" value="${s.selected}" autocomplete="off" spellcheck="false"></label>`;let fb=s.feedback?`<div class="feedback ${s.feedback.ok?'good':'wrong'}">${s.feedback.ok?'回答正确。':'回答不正确。'} 正确答案：<strong>${q.type==='choice'?q.z:q.w}</strong>。${s.feedback.gain?`获得 ${s.feedback.gain} 挑战积分。`:'本题不重复得分。'}</div>`:'';return `<div class="quiz">${head()}<div class="q-meta"><span>第 ${s.i+1} / 10 题</span><span class="timer" aria-live="polite">剩余 ${String(Math.floor(s.time/60)).padStart(2,'0')}:${String(s.time%60).padStart(2,'0')}</span></div><div class="panel"><span class="source">${q.course}</span><p class="prompt">${choice?q.w:q.z}</p><span class="score-status">${q.score?'本题答对可得 5 分':'复习题，不重复得分'}</span>${body}${fb}<div class="actions"><button data-a="leave">退出</button>${s.feedback?`<button class="primary" data-a="next">${s.i===9?'查看结果':'下一题'}</button>`:`<button class="primary" data-a="submit">提交答案</button>`}</div></div></div>`}
function result(){return head()+`<section class="panel"><p class="muted">本场测验已完成</p><h1>${s.correct} / 10 回答正确</h1><div class="metrics"><div class="metric"><strong>+${s.earned}</strong><span>本场新增挑战积分</span></div><div class="metric"><strong>3</strong><span>复习题</span></div><div class="metric"><strong>${s.points}</strong><span>本周个人积分</span></div></div><p class="notice">速度没有影响积分；日常学习 XP 与周挑战榜分开计算。</p><button class="primary" data-a="board">返回周挑战榜</button></section>`}
function render(){app.innerHTML=s.page==='board'?board():s.page==='quiz'?quiz():result();if(s.page==='quiz'&&qs[s.i].type==='spell')document.querySelector('#answer')?.focus()}
function submit(){let q=qs[s.i],a=q.type==='choice'?s.selected:document.querySelector('#answer').value;let ok=(a||'').trim().toLowerCase()===(q.type==='choice'?q.z:q.w).toLowerCase(),gain=ok&&q.score?5:0;s.feedback={ok,gain};if(ok)s.correct++;s.earned+=gain;s.points+=gain;render()}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.choice){s.selected=b.dataset.choice;render();return}if(b.dataset.a==='start'){s={...s,page:'quiz',i:0,selected:'',feedback:null,earned:0,correct:0,time:300};render()}if(b.dataset.a==='submit')submit();if(b.dataset.a==='next'){if(s.i===9)s.page='result';else{s.i++;s.selected='';s.feedback=null}render()}if(b.dataset.a==='board'){s.page='board';render()}if(b.dataset.a==='leave'&&confirm('已提交的回答和积分会保留，确定退出吗？')){s.page='board';render()}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&s.page==='quiz'&&!s.feedback)submit()});setInterval(()=>{if(s.page==='quiz'&&s.time>0){s.time--;if(s.time===0){s.page='result'}render()}},1000);render();
</script></main></body></html>
